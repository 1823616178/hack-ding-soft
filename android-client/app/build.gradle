apply plugin: 'com.android.application'

def sourceApk = rootProject.file('../base.apk')
def jniDir = file('src/main/jniLibs/arm64-v8a')
def sm2Source = rootProject.file('../web-client/sm2.config.local.json')

tasks.register('extractNativeLibs') {
    description = 'Extract the Hanvon face SDK and its C++ runtime from the source APK'
    inputs.file(sourceApk)
    outputs.dir(jniDir)
    doLast {
        if (!sourceApk.exists()) {
            throw new GradleException("Source APK not found: ${sourceApk}")
        }
        jniDir.mkdirs()
        copy {
            from zipTree(sourceApk)
            include 'lib/arm64-v8a/libHWFaceRecogLibSDK.so'
            include 'lib/arm64-v8a/libc++_shared.so'
            eachFile { details -> details.path = details.name }
            into jniDir
        }
        def required = ['libHWFaceRecogLibSDK.so', 'libc++_shared.so']
        required.each { name ->
            def file = new File(jniDir, name)
            if (!file.exists() || file.length() == 0L) {
                throw new GradleException("Native library extraction failed: ${name}")
            }
        }
    }
}

tasks.register('copySm2Config', Copy) {
    description = 'Copy the locally configured APK SM2 key material into assets (never committed)'
    onlyIf { sm2Source.exists() }
    from sm2Source
    into file('src/main/assets')
    rename { 'sm2.config.local.json' }
    doFirst {
        if (!sm2Source.exists()) {
            logger.warn('web-client/sm2.config.local.json is absent; TCP punching will be disabled at runtime')
        }
    }
}

android {
    namespace 'com.hanwang.facekey.thin'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.hanwang.facekey.thin'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.named('preBuild').configure {
    dependsOn 'extractNativeLibs', 'copySm2Config'
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.amap.api:search:9.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.11.0'
}
